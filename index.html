<html lang="ko">
<head>
<meta charset="utf-8">

<title>BOM 취합 결과</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1f2328; --muted: #6a737d; --line: #e3e6ea;
    --head: #33404f; --head-text: #ffffff; --accent: #2e5b9b;
    --g-cw: #dae6f2; --g-mold: #e2efda; --g-proc: #fff2cc;
    --o: #1f2328; --x: #c4c8cc; --diff-bg: #ffe5cc; --diff: #c00000; --row-hover: #eef3fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --panel: #1d2127; --text: #e6e8eb; --muted: #9aa3ad; --line: #30363d;
      --head: #2b3440; --head-text: #e6e8eb; --accent: #7aa7e6;
      --g-cw: #22303f; --g-mold: #24332a; --g-proc: #3a3420;
      --o: #f0f2f4; --x: #4a5058; --diff-bg: #4a3220; --diff: #ff8a80; --row-hover: #232b36;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181c; --panel: #1d2127; --text: #e6e8eb; --muted: #9aa3ad; --line: #30363d;
    --head: #2b3440; --head-text: #e6e8eb; --accent: #7aa7e6;
    --g-cw: #22303f; --g-mold: #24332a; --g-proc: #3a3420;
    --o: #f0f2f4; --x: #4a5058; --diff-bg: #4a3220; --diff: #ff8a80; --row-hover: #232b36;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; }
  header { padding: 16px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { color: var(--muted); font-size: 11px; }
  nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  nav button { border: 0; background: none; color: var(--muted); padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
  nav button.on { color: var(--text); border-bottom-color: var(--tab, var(--accent)); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
  .tools input[type=search] { flex: 1 1 220px; max-width: 360px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  .tools select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  .tools label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); margin-left: auto; font-size: 12px; }
  .wrap { margin: 0 16px 16px; overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { border-collapse: separate; border-spacing: 0; white-space: nowrap; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  thead th { position: sticky; top: 0; background: var(--head); color: var(--head-text); font-weight: 600; z-index: 2; }
  thead tr:nth-child(2) th { top: 27px; }
  th.p { writing-mode: vertical-rl; text-orientation: upright; padding: 6px 2px; font-size: 11px; letter-spacing: -1px; min-width: 22px; }
  thead th.gcw { background: #3f6a96; } thead th.gmold { background: #4d7f3a; } thead th.gproc { background: #9a7a1e; }
  td.p { text-align: center; padding: 4px 2px; min-width: 22px; }
  td.cw { background: var(--g-cw); } td.mold { background: var(--g-mold); } td.proc { background: var(--g-proc); }
  td.o { color: var(--o); font-weight: 700; } td.x { color: var(--x); }
  td.gs { border-left: 2px solid var(--muted); }
  td.diff { background: var(--diff-bg); }
  td.mark { color: var(--diff); text-align: center; font-weight: 700; }
  .sticky { position: sticky; background: var(--panel); z-index: 1; }
  thead .sticky { z-index: 3; background: var(--head); }
  tbody tr:hover td { background-image: linear-gradient(var(--row-hover), var(--row-hover)); }
  td.name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  td.mt { color: var(--diff); font-weight: 700; }
  tr.sep td { border-top: 2px solid var(--muted); }
  .empty { padding: 24px; color: var(--muted); }
  @media (max-width: 640px) { .wrap { margin: 0 8px 8px; max-height: none; } header, .tools { padding-left: 8px; padding-right: 8px; } }
</style>
</head>

const P = DATA.proc, NF = P.fixed, NP = P.h2.length - NF - 2;
const grpOf = []; { let g = ""; for (let i = 0; i < P.h1.length; i++) { if (i >= NF && i < NF + NP) { if (P.h1[i]) g = P.h1[i]; grpOf[i] = g; } } }
const gcls = { "창원": "cw", "금형": "mold", "가공": "proc" };
const stickyCols = [0, 1, 2];
const lines = [...new Set(P.rows.map(r => r[6]).filter(Boolean))].sort();
document.getElementById("line").innerHTML += lines.map(l => `<option>${esc(l)}</option>`).join("") + `<option value="__none">(라인구분 없음)</option>`;

function procHead() {
  let a = "<thead><tr>", b = "<tr>";
  for (let i = 0; i < P.h2.length; i++) {
    if (i >= NF && i < NF + NP) {
      if (P.h1[i]) { let n = 0; while (i + n < NF + NP && grpOf[i + n] === grpOf[i]) n++; a += `<th colspan="${n}" class="g${gcls[grpOf[i]]}">${esc(P.h1[i])}</th>`; }
      b += `<th class="p g${gcls[grpOf[i]]}">${esc(P.h2[i])}</th>`;
    } else {
      a += `<th rowspan="2" data-c="${i}">${esc(P.h1[i])}</th>`;
    }
  }
  return a + "</tr>" + b + "</tr></thead>";
}
function renderProc() {
  const q = document.getElementById("q1").value.trim().toLowerCase();
  const ln = document.getElementById("line").value, d = document.getElementById("diffOnly").checked;
  const rows = P.rows.filter(r =>
    (!q || [1, 2, 3, 4, 7, 8].some(i => String(r[i] ?? "").toLowerCase().includes(q))) &&
    (!ln || (ln === "__none" ? !r[6] : r[6] === ln)) && (!d || r[5] === "◆"));
  let h = "<tbody>";
  for (const r of rows) {
    h += "<tr>";
    for (let i = 0; i < r.length; i++) {
      const v = r[i] ?? "";
      if (i >= NF && i < NF + NP) {
        const gs = P.h1[i] && i > NF ? " gs" : "";
        h += `<td class="p ${gcls[grpOf[i]]} ${v === "○" ? "o" : "x"}${gs}">${v}</td>`;
      } else {
        let c = stickyCols.includes(i) ? "sticky" : "";
        if (i === 2 || i === 4 || i === 9) c += " name";
        if (i === 5) c += " mark";
        if ((i === 3 || i === 4 || i === 5) && r[5] === "◆") c += " diff";
        h += `<td class="${c}" title="${esc(v)}">${esc(v)}</td>`;
      }
    }
    h += "</tr>";
  }
  const t = document.getElementById("t1");
  t.innerHTML = procHead() + h + "</tbody>";
  if (!rows.length) t.innerHTML += `<tbody><tr><td class="empty" colspan="${P.h2.length}">조건에 맞는 행이 없습니다.</td></tr></tbody>`;
  document.getElementById("c1").textContent = `${rows.length.toLocaleString()} / ${P.rows.length.toLocaleString()}행`;
  fixSticky(t);
}
function fixSticky(t) {
  const first = t.tBodies[0] && t.tBodies[0].rows[0]; if (!first) return;
  let left = 0;
  stickyCols.forEach(ci => {
    const w = first.cells[ci].getBoundingClientRect().width;
    t.querySelectorAll(`tbody tr td:nth-child(${ci + 1})`).forEach(td => td.style.left = left + "px");
    const th = t.querySelector(`thead th[data-c="${ci}"]`); if (th) { th.classList.add("sticky"); th.style.left = left + "px"; }
    left += w;
  });
}
["q1", "line", "diffOnly"].forEach(id => document.getElementById(id).addEventListener("input", renderProc));
renderProc();

function renderChips() {
  const all = [["", "전체", M.rows.length], ...M.summary.map(([k, v]) => [k, k, v])];
  document.getElementById("chips").innerHTML = all.map(([k, label, n]) => `<button class="chip${k === mType ? " on" : ""}" data-k="${esc(k)}">${esc(label)} ${n}</button>`).join(" ");
  document.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => { mType = b.dataset.k; renderChips(); renderMiss(); });
}
function renderMiss() {
  const q = document.getElementById("q2").value.trim().toLowerCase();
  const rows = M.rows.filter(r => (!mType || r[1] === mType) && (!q || [2, 3, 4, 5, 7].some(i => String(r[i] ?? "").toLowerCase().includes(q))));
  let h = "<thead><tr>" + M.h.map(x => `<th>${esc(x)}</th>`).join("") + "</tr></thead><tbody>";
  let prev = null;
  for (const r of rows) {
    h += `<tr${prev !== null && r[1] !== prev ? ' class="sep"' : ""}>` + r.map((v, i) => `<td class="${i === 1 ? "mt" : ""}${i === 3 || i === 5 ? " name" : ""}" title="${esc(v)}">${esc(v)}</td>`).join("") + "</tr>";
    prev = r[1];
  }
  if (!rows.length) h += `<tr><td class="empty" colspan="${M.h.length}">조건에 맞는 행이 없습니다.</td></tr>`;
  document.getElementById("t2").innerHTML = h + "</tbody>";
  document.getElementById("c2").textContent = `${rows.length.toLocaleString()} / ${M.rows.length.toLocaleString()}건`;
}
document.getElementById("q2").addEventListener("input", renderMiss);
renderChips(); renderMiss();
</script>
</body>
</html>
